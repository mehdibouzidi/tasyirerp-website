# Configuration Cloudflare Pages
# Aucune variable ici : la configuration du formulaire se fait uniquement par des secrets
# dans Cloudflare Pages > Settings > Variables and Secrets :
#   SMTP_USER      = contact@tasyirerp.com
#   SMTP_PASSWORD  = mot de passe de la boîte OVH
name = "tasyirerp-website"
pages_build_output_dir = "public"
compatibility_date = "2026-10-01"
